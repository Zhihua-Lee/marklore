[package]
name = "marklore-index"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Link index and note search for Marklore's main process"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["node"]
# The Node binding. `cargo test --no-default-features` tests the index alone.
node = ["dep:napi", "dep:napi-derive"]

[dependencies]
fancy-regex = "0.14"
indexmap = { version = "2", features = ["rayon"] }
memchr = "2"
rayon = "1"
napi = { version = "2", default-features = false, features = ["napi4", "dyn-symbols"], optional = true }
napi-derive = { version = "2", optional = true }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 4
strip = true
